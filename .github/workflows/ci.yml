name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: make test

      - name: Validate POSIX and Alpine installer syntax
        run: |
          sh -n install.sh
          sh -n time-sync-check.sh
          sh .github/tests/installer-checksum-test.sh install.sh
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh -c 'apk add --no-cache curl >/dev/null && sh /src/.github/tests/installer-checksum-test.sh /src/install.sh'
          CGO_ENABLED=0 go build -o /tmp/coradectl ./cmd/xbctl
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh -n /src/install.sh
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh -n /src/time-sync-check.sh
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh /src/.github/tests/systemd-install-test.sh
          docker run --rm --privileged -v "$PWD:/src:ro" -v /tmp/coradectl:/usr/local/bin/coradectl:ro alpine:3.22 /bin/sh /src/.github/tests/openrc-install-test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

