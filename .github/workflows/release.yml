name: Build and publish Corade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-corade-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate installer
        run: |
          sh -n install.sh
          sh -n time-sync-check.sh
          sh .github/tests/installer-checksum-test.sh install.sh
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh -c 'apk add --no-cache curl >/dev/null && sh /src/.github/tests/installer-checksum-test.sh /src/install.sh'
          CGO_ENABLED=0 go build -o /tmp/coradectl ./cmd/xbctl
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh -n /src/install.sh
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 /bin/sh /src/.github/tests/systemd-install-test.sh
          docker run --rm --privileged -v "$PWD:/src:ro" -v /tmp/coradectl:/usr/local/bin/coradectl:ro alpine:3.22 /bin/sh /src/.github/tests/openrc-install-test.sh
      - run: go test ./...

  publish:
    name: Build and publish to CPP
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Read Agent version
        id: version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          BUILD_SHA=$(printf '%.12s' "$GITHUB_SHA")
          echo "base=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$VERSION+$BUILD_SHA" >> "$GITHUB_OUTPUT"
      # Keep both architectures in this job; Releases do not use Actions artifact storage.
      - name: Build Linux Agent and CLI for all architectures
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          VERSION: ${{ steps.version.outputs.build }}
        run: |
          mkdir -p dist
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -tags "with_quic with_utls with_wireguard with_acme with_clash_api" \
              -ldflags "-s -w -X main.version=$VERSION -X main.buildTime=$BUILD_TIME" \
              -o "dist/corade-linux-$arch" ./cmd/corade
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.buildTime=$BUILD_TIME" \
              -o "dist/coradectl-linux-$arch" ./cmd/xbctl
          done
          cd dist
          for arch in amd64 arm64; do
            for binary in corade coradectl; do
              artifact="$binary-linux-$arch"
              test -s "$artifact"
              sha256sum "$artifact" > "$artifact.sha256"
            done
          done
          sha256sum -c ./*.sha256

      - name: Publish to CPP
        env:
          GH_TOKEN: ${{ secrets.CPP_RELEASE_TOKEN }}
          GH_REPO: ClaraCora/CPP
        run: |
          test -n "$GH_TOKEN" || { echo "CPP_RELEASE_TOKEN is not configured" >&2; exit 1; }
          VERSION=$(tr -d '\r\n' < VERSION)
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          BUILD_SHA=$(printf '%.12s' "$GITHUB_SHA")
          BUILD_VERSION="$VERSION+$BUILD_SHA"
          printf '%s\n' "$BUILD_VERSION" > dist/agent-version.txt
          printf '%s\n' "$GITHUB_SHA" > dist/source-sha.txt
          cat > dist/release-manifest.json <<EOF
          {"component":"corade","version":"$BUILD_VERSION","source_repository":"$GITHUB_REPOSITORY","source_commit":"$GITHUB_SHA"}
          EOF

          VERSION_TAG="corade-$VERSION"
          if gh release view "$VERSION_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir -p existing
            gh release download "$VERSION_TAG" --repo "$GH_REPO" --pattern source-sha.txt --dir existing
            test "$(tr -d '\r\n' < existing/source-sha.txt)" = "$GITHUB_SHA" || {
              echo "CPP release $VERSION_TAG already belongs to another commit; bump VERSION before publishing" >&2
              exit 1
            }
            gh release upload "$VERSION_TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$VERSION_TAG" dist/* --repo "$GH_REPO" --title "Corade $VERSION" --notes "Corade $BUILD_VERSION. Checksums and source metadata are included in the assets."
          fi

          ROLLING_TAG="corade-latest"
          NOTES="Rolling Corade build $BUILD_VERSION. Checksums and source metadata are included in the assets."
          if gh release view "$ROLLING_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$ROLLING_TAG" --repo "$GH_REPO" --title "Corade latest ($BUILD_VERSION)" --prerelease --notes "$NOTES"
            gh release upload "$ROLLING_TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$ROLLING_TAG" dist/* --repo "$GH_REPO" --title "Corade latest ($BUILD_VERSION)" --prerelease --notes "$NOTES"
          fi
